[workspace]
members = ["crates/portal-core", "crates/portal-cli", "crates/portal-gui"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
version = "0.1.0"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6"
rpassword = "7"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal", "net", "io-util"] }
url = "2"
webbrowser = "1"
sysinfo = "0.35"
