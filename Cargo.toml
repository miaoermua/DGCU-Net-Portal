[workspace]
members = ["crates/portal-cli", "crates/portal-gui"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
version = "0.3.8"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6"
rpassword = "7"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal", "net", "io-util", "io-std"] }
url = "2"
webbrowser = "1"
dom_query = "0.27"
regex = "1"
network-interface = "2.0.5"
interprocess = { version = "2.4.4", features = ["tokio"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
