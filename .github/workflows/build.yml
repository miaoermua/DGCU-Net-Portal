name: build

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  NODE_VERSION: '24'
  PNPM_VERSION: '11.19.0'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: 前端构建
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: crates/portal-gui/frontend/pnpm-lock.yaml
      - run: pnpm --dir crates/portal-gui/frontend install --frozen-lockfile
      - run: pnpm --dir crates/portal-gui/frontend test
      - run: pnpm --dir crates/portal-gui/frontend build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: crates/portal-gui/frontend/dist
          retention-days: 3

  macos:
    name: macOS ${{ matrix.arch }}
    needs: frontend
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, arch: arm64 }
          - { target: x86_64-apple-darwin, arch: x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: crates/portal-gui/frontend/dist
      - name: 编译 GUI 与 CLI
        run: >-
          cargo build --release --locked -p portal-gui -p portal-cli
          --features portal-gui/custom-protocol --target ${{ matrix.target }}
      - name: 打包 .app / ZIP / SHA-256
        run: >-
          python3 scripts/package_macos.py --output target/packages
          --arch ${{ matrix.arch }} --binary-dir target/${{ matrix.target }}/release
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            target/packages/*.zip
            target/packages/*.sha256
  windows:
    name: Windows ${{ matrix.arch }}
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, target: x86_64-pc-windows-msvc, arch: x86_64 }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, arch: aarch64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.arch }}
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: crates/portal-gui/frontend/dist
      - name: 编译 GUI 与 CLI
        run: >-
          cargo build --release --locked -p portal-gui -p portal-cli
          --features portal-gui/custom-protocol --target ${{ matrix.target }}
      - name: 打包 ZIP / SHA-256
        run: >-
          python scripts/package_portable.py --platform windows
          --arch ${{ matrix.arch }} --output target/packages
          --binary-dir target/${{ matrix.target }}/release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            target/packages/*.zip
            target/packages/*.sha256

  linux:
    name: Linux x86_64
    needs: frontend
    runs-on: ubuntu-24.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
      NO_STRIP: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev libsoup-3.0-dev libxdo-dev patchelf file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: crates/portal-gui/frontend/dist
      - name: 编译 GUI 与 CLI
        run: >-
          cargo build --release --locked -p portal-gui -p portal-cli
          --features portal-gui/custom-protocol
      - name: 打包 tar.gz / SHA-256
        run: >-
          python3 scripts/package_portable.py --platform linux
          --arch x86_64 --output target/packages
      - name: 打包 AppImage
        run: |
          npm install --global @tauri-apps/cli@^2
          version=$(jq -r .version crates/portal-gui/tauri.conf.json)
          echo '{"bundle":{"active":true,"targets":["appimage"]}}' > /tmp/tauri.ci.json
          (cd crates/portal-gui && tauri build --config /tmp/tauri.ci.json)
          src=$(find target/release/bundle/appimage -name '*.AppImage' | head -n 1)
          test -n "$src"
          name="DGCU-Net-Portal-${version}-linux-x86_64.AppImage"
          cp "$src" "target/packages/$name"
          (cd target/packages && sha256sum "$name" > "$name.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            target/packages/*.tar.gz
            target/packages/*.AppImage
            target/packages/*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            target/release/portal-gui
            target/release/portal-cli
          retention-days: 1
  archlinux:
    name: Arch Linux 包
    needs: [frontend, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: target/release
      - name: 准备 makepkg 工作目录
        run: |
          version=$(jq -r .version crates/portal-gui/tauri.conf.json)
          mkdir -p target/arch
          cp target/release/portal-gui target/arch/portal-gui
          cp target/release/portal-cli target/arch/portal-cli
          cp crates/portal-gui/icons/icon.png target/arch/portal-gui.png
          cp packaging/arch/dgcu-portal.desktop packaging/arch/PKGBUILD target/arch/
          cp LICENSE target/arch/LICENSE
          sed -i "s/^pkgver=.*/pkgver=${version}/" target/arch/PKGBUILD
          chmod 777 target/arch
      - name: makepkg（Arch 容器）
        run: |
          docker run --rm -v "$PWD/target/arch:/work" -w /work archlinux:latest bash -c '
            set -euo pipefail
            pacman -Syu --noconfirm --needed \
              base-devel gtk3 webkit2gtk-4.1 libayatana-appindicator libsecret
            useradd -m builder
            chown -R builder /work
            su builder -c "makepkg -f --noconfirm"
          '
      - name: 生成 SHA-256
        run: |
          cd target/arch
          pkg=$(ls dgcu-net-portal-*.pkg.tar.zst)
          sha256sum "$pkg" > "$pkg.sha256"
          cat "$pkg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: archlinux-x86_64
          path: target/arch/dgcu-net-portal-*.pkg.tar.zst*

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux, archlinux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: 汇总 SHA256SUMS.txt
        run: |
          cd release
          ls -l
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' \
            | sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release/**
          generate_release_notes: true
